apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
android {
    namespace 'com.obligio.watch'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'com.obligio.app'
        minSdk 30
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1000001
        versionName '1.0'
    }
    signingConfigs {
        debug {
            storeFile file('../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    // Release signing is supplied by the same upload identity as the phone.
    signingConfigs.create('release') {
        def value = { name -> providers.environmentVariable(name).orElse(providers.gradleProperty(name)).orNull }
        def keyPath = value('OBLIGIO_UPLOAD_STORE_FILE')
        if (keyPath) storeFile file(keyPath)
        storePassword value('OBLIGIO_UPLOAD_STORE_PASSWORD')
        keyAlias value('OBLIGIO_UPLOAD_KEY_ALIAS')
        keyPassword value('OBLIGIO_UPLOAD_KEY_PASSWORD')
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}
dependencies { implementation 'com.google.android.gms:play-services-wearable:20.0.1' }
